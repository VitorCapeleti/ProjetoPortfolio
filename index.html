    <!-- Antes de pintar: marca JS, decide o loader e instala o fallback de imagens (webp → png). -->
    <script>
        (function (d) {
            var c = d.documentElement.classList;
            c.add('js');
            try {
                var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (!reduced && !window.sessionStorage.getItem('vc-visited')) c.add('show-loader');
            } catch (e) { /* sessionStorage bloqueado: sem loader */ }
            d.addEventListener('error', function (e) {
                var t = e.target;
                if (t && t.tagName === 'IMG' && t.getAttribute('data-fallback')) {
                    var f = t.getAttribute('data-fallback');
                    t.removeAttribute('data-fallback');
                    t.src = f;
                }
            }, true);
        })(document);
    </script>

    <!-- Cenário: recortes do fundo original, cada um no lugar exato da arte (background-size: cover). -->

        <div class="scene-camera">
            <div class="scene-stage">
                <img class="scene-bg" src="img/layers/bg-gradient.webp" data-fallback="img/layers/bg-base.png" alt="" decoding="async">
                <div class="layer layer--far" data-layer="far"></div>
                <div class="layer layer--stars" data-layer="stars">
                    <img src="img/layers/stars.webp" data-fallback="img/layers/stars.png" alt="" decoding="async">
                </div>
                <div class="layer layer--moon" data-layer="moon">
                    <div class="life"><img src="img/layers/moon.webp" data-fallback="img/layers/moon.png" alt="" decoding="async"></div>
                </div>
                <div class="layer layer--saturn" data-layer="saturn">
                    <div class="life"><img src="img/layers/saturn.webp" data-fallback="img/layers/saturn.png" alt="" decoding="async"></div>
                </div>
                <div class="layer layer--galaxy" data-layer="galaxy">
                    <div class="life">
                        <img src="img/layers/galaxy.webp" data-fallback="img/layers/galaxy.png" alt="" decoding="async">
                        <span class="galaxy-glow"></span>
                    </div>
                </div>
                <div class="layer layer--planet" data-layer="planet">
                    <div class="life"><img src="img/layers/planet.webp" data-fallback="img/layers/planet.png" alt="" decoding="async"></div>
                </div>
                <div class="layer layer--rocket" data-layer="rocket">
                    <div class="rocket-fly">
                        <span class="rocket-flame"></span>
                        <div class="life"><img src="img/layers/rocket.webp" data-fallback="img/layers/rocket.png" alt="" decoding="async"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="scene-fx"></div>
        <canvas class="scene-warp"></canvas>
    </div>
